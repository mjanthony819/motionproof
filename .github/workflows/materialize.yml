name: Materialize verified MotionProof source once
on:
  push:
    branches: [main]
    paths: [.github/workflows/materialize.yml]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify archive and restore proper source paths
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, io, zipfile
          root=Path.cwd().resolve()
          archive=root/'4-MotionProof_source.zip'
          payload=archive.read_bytes()
          expected='79bdbd57c1b9305db8ce68edfeae544e65a5605c0113c6849a95ffd1dd7034dd'
          assert hashlib.sha256(payload).hexdigest()==expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert len(z.infolist())<100, 'Unexpected archive count'
              for info in z.infolist():
                  if info.is_dir(): continue
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0]=='MotionProof' and len(p.parts)>1
                  assert info.file_size<25000000
                  assert (info.external_attr >> 16) & 0o170000 != 0o120000, 'No symlinks'
                  assert '.git' not in p.parts and '.github' not in p.parts
                  target=root.joinpath(*p.parts[1:]).resolve()
                  assert target.is_relative_to(root), 'Path escapes repository'
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(info))
          archive.unlink()
          (root/'.github/workflows/materialize.yml').unlink()
      - name: Check parity tests and commit source tree
        shell: bash
        run: |
          grep -v ' ./SHA256SUMS.txt$' SHA256SUMS.txt | sha256sum -c --quiet
          node tests/parity.test.js
          git add -A
          git -c user.name='MotionProof source build' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'Restore verified source tree and remove one-time helper'
          git push
